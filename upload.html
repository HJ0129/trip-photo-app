<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>직접 파일 선택 테스트</title>
</head>
<body style="font-family:sans-serif; padding:20px;">

  <h2>직접 파일 선택 테스트</h2>

  <p>아래 입력창을 직접 눌러보세요.</p>

  <input id="fileInput" type="file" accept="image/*" multiple style="font-size:18px;">

  <p id="result" style="margin-top:20px;">대기 중</p>

  <script>
    const fileInput = document.getElementById("fileInput");
    const result = document.getElementById("result");

    fileInput.addEventListener("change", (e) => {
      const count = e.target.files.length;
      result.textContent = count > 0 ? `파일 선택됨: ${count}개` : "선택 안 됨";
      alert(count > 0 ? `파일 선택됨: ${count}개` : "선택 안 됨");
    });
  </script>

</body>
</html>
