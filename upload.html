<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>사진 업로드</title>
<link rel="stylesheet" href="style.css">

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getStorage, ref, uploadBytesResumable, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";
  import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyD6RYhfF9PAToTmoxkQLSxUAXeCQDTY6nA",
    authDomain: "upload-business-photo.firebaseapp.com",
    projectId: "upload-business-photo",
    storageBucket: "upload-business-photo.firebasestorage.app",
    messagingSenderId: "509973531120",
    appId: "1:509973531120:web:fe7f5481e2402a6abb7535"
};

  const app = initializeApp(firebaseConfig);
  const storage = getStorage(app);
  const db = getFirestore(app);

  const code = "482917";

  window.addEventListener("DOMContentLoaded", () => {
    const addPhotoBtn = document.getElementById("addPhotoBtn");
    const fileInput = document.getElementById("fileInput");
    const progressText = document.getElementById("progressText");
    const progressFill = document.getElementById("progressFill");
    const thumbGrid = document.getElementById("thumbGrid");

    let uploadedCount = 0;
    let totalCount = 0;

    addPhotoBtn.addEventListener("click", () => {
      fileInput.click();
    });

    fileInput.addEventListener("change", async (event) => {
      const files = Array.from(event.target.files);
      if (files.length === 0) return;

      totalCount += files.length;
      progressText.textContent = `전체 진행률: ${uploadedCount} / ${totalCount}장 완료`;

      for (const file of files) {
        const fileName = `${Date.now()}_${file.name}`;
        const storageRef = ref(storage, `uploads/${code}/${fileName}`);
        const uploadTask = uploadBytesResumable(storageRef, file);

        const thumb = document.createElement("div");
        thumb.className = "thumb";
        thumb.textContent = "⏳";
        thumbGrid.appendChild(thumb);

        uploadTask.on(
          "state_changed",
          null,
          (error) => {
            console.error("업로드 실패:", error);
            thumb.textContent = "❌";
          },
          async () => {
            const downloadURL = await getDownloadURL(uploadTask.snapshot.ref);

            await addDoc(collection(db, "photos"), {
              code: code,
              fileName: file.name,
              storagePath: `uploads/${code}/${fileName}`,
              downloadURL: downloadURL,
              createdAt: serverTimestamp()
            });

            uploadedCount++;
            thumb.textContent = "✅";
            progressText.textContent = `전체 진행률: ${uploadedCount} / ${totalCount}장 완료`;
            progressFill.style.width = `${(uploadedCount / totalCount) * 100}%`;
          }
        );
      }

      fileInput.value = "";
    });
  });
</script>
</head>
<body>
  <div class="screen">
    <h1>482917 · 사진 올리는 중</h1>

    <button id="addPhotoBtn" class="btn btn-secondary">+ 사진 추가하기</button>
    <input type="file" id="fileInput" accept="image/*" multiple style="display:none;">

    <p id="progressText" class="notice">전체 진행률: 0 / 0장 완료</p>
    <div class="progress-bar">
      <div id="progressFill" class="progress-bar-fill" style="width:0%;"></div>
    </div>

    <div id="thumbGrid" class="thumb-grid"></div>

    <p class="notice">⚠️ 실패한 사진이 있으면 다시 업로드 버튼을 추가할 수 있습니다.</p>
    <a href="complete.html" class="btn btn-primary">업로드 완료하기</a>
  </div>
</body>
</html>
