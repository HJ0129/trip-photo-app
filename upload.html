<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>사진 업로드</title>
  <link rel="stylesheet" href="style.css">

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getStorage, ref, uploadBytesResumable, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";
    import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

   const firebaseConfig = {
  apiKey: "AIzaSyD6RYhfF9PAToTmoxkQLSxUAXeCQDTY6nA",
  authDomain: "upload-business-photo.firebaseapp.com",
  projectId: "upload-business-photo",
  storageBucket: "upload-business-photo.firebasestorage.app",
  messagingSenderId: "509973531120",
  appId: "1:509973531120:web:fe7f5481e2402a6abb7535"
};

    const app = initializeApp(firebaseConfig);
    const storage = getStorage(app);
    const db = getFirestore(app);

    const uploadCode = "482917";
    let successCount = 0;
    let failCount = 0;
    let totalCount = 0;

    window.addEventListener("DOMContentLoaded", () => {
      const addPhotoBtn = document.getElementById("addPhotoBtn");
      const fileInput = document.getElementById("fileInput");
      const progressText = document.getElementById("progressText");
      const progressFill = document.getElementById("progressFill");
      const thumbGrid = document.getElementById("thumbGrid");
      const failText = document.getElementById("failText");

      addPhotoBtn.addEventListener("click", () => {
        fileInput.click();
      });

      fileInput.addEventListener("change", async (event) => {
        const files = Array.from(event.target.files);

        if (!files.length) return;

        totalCount += files.length;
        updateStatus();

        for (const file of files) {
          const thumb = document.createElement("div");
          thumb.className = "thumb";
          thumb.textContent = "⏳";
          thumbGrid.appendChild(thumb);

          try {
            const fileName = `${Date.now()}_${file.name}`;
            const storageRef = ref(storage, `uploads/${uploadCode}/${fileName}`);
            const uploadTask = uploadBytesResumable(storageRef, file);

            await new Promise((resolve, reject) => {
              uploadTask.on(
                "state_changed",
                null,
                reject,
                resolve
              );
            });

            const downloadURL = await getDownloadURL(uploadTask.snapshot.ref);

            await addDoc(collection(db, "photos"), {
              code: uploadCode,
              fileName: file.name,
              storagePath: `uploads/${uploadCode}/${fileName}`,
              downloadURL: downloadURL,
              createdAt: serverTimestamp()
            });

            successCount++;
            thumb.textContent = "✅";
          } catch (error) {
            console.error("업로드 실패:", error);
            failCount++;
            thumb.textContent = "❌";
          }

          updateStatus();
        }

        fileInput.value = "";
      });

      function updateStatus() {
        progressText.textContent = `전체 진행률: ${successCount} / ${totalCount}장 완료`;

        const percent = totalCount === 0 ? 0 : (successCount / totalCount) * 100;
        progressFill.style.width = `${percent}%`;

        if (failCount > 0) {
          failText.textContent = `⚠️ 실패한 사진 ${failCount}장`;
        } else {
          failText.textContent = "";
        }
      }
    });
  </script>
</head>
<body>
  <div class="screen">
    <h1 id="pageTitle">482917 · 사진 올리는 중</h1>

    <button id="addPhotoBtn" class="btn btn-secondary">+ 사진 추가하기</button>
    <input type="file" id="photoInput" accept="image/*" multiple hidden>

    <p id="progressText" class="notice">전체 진행률: 0 / 50장 완료</p>
    <div class="progress-bar">
      <div id="progressBarFill" class="progress-bar-fill" style="width:0%;"></div>
    </div>

    <div id="thumbGrid" class="thumb-grid"></div>

    <p id="failText" class="notice" style="display:none;">⚠️ 실패한 사진 0장</p>
    <button id="retryBtn" class="btn btn-danger" style="display:none;">🔄 실패한 사진 다시 올리기</button>

    <a href="complete.html" class="btn btn-primary">업로드 완료하기</a>
  </div>
</body>
</body>
  <script type="module">
  import {
    ref,
    uploadBytesResumable,
    getDownloadURL
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";

  import {
    collection,
    addDoc,
    serverTimestamp
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const storage = window.storage;
  const db = window.db;

  const code = "482917";
  const maxPhotos = 50;

  const addPhotoBtn = document.getElementById("addPhotoBtn");
  const photoInput = document.getElementById("photoInput");
  const progressText = document.getElementById("progressText");
  const progressBarFill = document.getElementById("progressBarFill");
  const thumbGrid = document.getElementById("thumbGrid");
  const failText = document.getElementById("failText");
  const retryBtn = document.getElementById("retryBtn");

  let uploadedCount = 0;
  let failedFiles = [];

  addPhotoBtn.addEventListener("click", () => {
    photoInput.click();
  });

  photoInput.addEventListener("change", async (e) => {
    const files = Array.from(e.target.files);

    if (!files.length) return;

    for (const file of files) {
      if (uploadedCount >= maxPhotos) {
        alert("최대 50장까지 업로드할 수 있습니다.");
        break;
      }

      await uploadSingleFile(file);
    }

    photoInput.value = "";
    updateUI();
  });

  retryBtn.addEventListener("click", async () => {
    const retryTargets = [...failedFiles];
    failedFiles = [];

    for (const file of retryTargets) {
      await uploadSingleFile(file);
    }

    updateUI();
  });

  async function uploadSingleFile(file) {
    const thumb = document.createElement("div");
    thumb.className = "thumb";
    thumb.textContent = "⏳";
    thumbGrid.appendChild(thumb);

    try {
      const fileName = `${Date.now()}_${file.name}`;
      const storageRef = ref(storage, `uploads/${code}/${fileName}`);

      const uploadTask = uploadBytesResumable(storageRef, file);

      await new Promise((resolve, reject) => {
        uploadTask.on(
          "state_changed",
          null,
          reject,
          resolve
        );
      });

      const downloadURL = await getDownloadURL(uploadTask.snapshot.ref);

      await addDoc(collection(db, "photos"), {
        code: code,
        fileName: file.name,
        storedFileName: fileName,
        downloadURL: downloadURL,
        uploadedAt: serverTimestamp()
      });

      uploadedCount++;
      thumb.textContent = "✅";
    } catch (error) {
      console.error("업로드 실패:", error);
      thumb.textContent = "❌";
      failedFiles.push(file);
    }
  }

  function updateUI() {
    progressText.textContent = `전체 진행률: ${uploadedCount} / ${maxPhotos}장 완료`;
    progressBarFill.style.width = `${(uploadedCount / maxPhotos) * 100}%`;

    if (failedFiles.length > 0) {
      failText.style.display = "block";
      failText.textContent = `⚠️ 실패한 사진 ${failedFiles.length}장`;
      retryBtn.style.display = "inline-block";
    } else {
      failText.style.display = "none";
      retryBtn.style.display = "none";
    }
  }

  updateUI();
</script>
</html>
