<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>사진 업로드</title>
<link rel="stylesheet" href="style.css">

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getStorage, ref, uploadBytesResumable, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";
  import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyD6RYhfF9PAToTmoxkQLSxUAXeCQDTY6nA",
    authDomain: "upload-business-photo.firebaseapp.com",
    projectId: "upload-business-photo",
    storageBucket: "upload-business-photo.firebasestorage.app",
    messagingSenderId: "509973531120",
    appId: "1:509973531120:web:fe7f5481e2402a6abb7535"
  };

  const app = initializeApp(firebaseConfig);
  const storage = getStorage(app);
  const db = getFirestore(app);

  const uploadCode = "482917";

  window.addEventListener("DOMContentLoaded", () => {
    const addPhotoBtn = document.getElementById("addPhotoBtn");
    const fileInput = document.getElementById("fileInput");
    const progressText = document.getElementById("progressText");
    const progressFill = document.getElementById("progressFill");
    const thumbGrid = document.getElementById("thumbGrid");
    const failText = document.getElementById("failText");

    let totalFiles = 0;
    let completedFiles = 0;
    let failedFiles = 0;

    addPhotoBtn.addEventListener("click", () => {
      fileInput.click();
    });

    fileInput.addEventListener("change", async (e) => {
      const files = Array.from(e.target.files);
      if (!files.length) return;

      totalFiles += files.length;
      updateStatus();

      for (const file of files) {
        const thumb = document.createElement("div");
        thumb.className = "thumb";
        thumb.textContent = "⏳";
        thumbGrid.appendChild(thumb);

        try {
          const fileName = `${Date.now()}_${file.name}`;
          const storageRef = ref(storage, `uploads/${uploadCode}/${fileName}`);
          const uploadTask = uploadBytesResumable(storageRef, file);

          await new Promise((resolve, reject) => {
            uploadTask.on(
              "state_changed",
              null,
              reject,
              resolve
            );
          });

          const downloadURL = await getDownloadURL(uploadTask.snapshot.ref);

          await addDoc(collection(db, "photos"), {
            code: uploadCode,
            fileName: file.name,
            storagePath: `uploads/${uploadCode}/${fileName}`,
            downloadURL: downloadURL,
            createdAt: serverTimestamp()
          });

          completedFiles++;
          thumb.textContent = "✅";
        } catch (error) {
          console.error("업로드 실패:", error);
          failedFiles++;
          thumb.textContent = "❌";
        }

        updateStatus();
      }

      fileInput.value = "";
    });

    function updateStatus() {
      progressText.textContent = `전체 진행률: ${completedFiles} / ${totalFiles}장 완료`;
      const percent = totalFiles === 0 ? 0 : (completedFiles / totalFiles) * 100;
      progressFill.style.width = `${percent}%`;

      if (failedFiles > 0) {
        failText.textContent = `⚠️ 실패한 사진 ${failedFiles}장`;
      } else {
        failText.textContent = "";
      }
    }
  });
</script>
</head>
<body>
  <div class="screen">
    <h1>482917 · 사진 올리는 중</h1>

    <button id="addPhotoBtn" class="btn btn-secondary">+ 사진 추가하기</button>
    <input id="fileInput" type="file" accept="image/*" multiple hidden>

    <p id="progressText" class="notice">전체 진행률: 0 / 0장 완료</p>
    <div class="progress-bar">
      <div id="progressFill" class="progress-bar-fill" style="width:0%;"></div>
    </div>

    <div id="thumbGrid" class="thumb-grid"></div>

    <p id="failText" class="notice"></p>

    <a href="complete.html" class="btn btn-primary">업로드 완료하기</a>
  </div>
</body>
</html>
