<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>사진 업로드</title>
<link rel="stylesheet" href="style.css">

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getStorage, ref, uploadBytesResumable, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";
  import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyD6RYhfF9PAToTmoxkQLSxUAXeCQDTY6nA",
    authDomain: "upload-business-photo.firebaseapp.com",
    projectId: "upload-business-photo",
    storageBucket: "upload-business-photo.firebasestorage.app",
    messagingSenderId: "509973531120",
    appId: "1:509973531120:web:fe7f5481e2402a6abb7535"
  };

  const app = initializeApp(firebaseConfig);
  const storage = getStorage(app);
  const db = getFirestore(app);

  const uploadCode = "482917";

  window.addEventListener("DOMContentLoaded", () => {
    const addPhotoBtn = document.getElementById("addPhotoBtn");
    const fileInput = document.getElementById("fileInput");
    const progressText = document.getElementById("progressText");
    const progressFill = document.getElementById("progressFill");
    const thumbGrid = document.getElementById("thumbGrid");
    const failNotice = document.getElementById("failNotice");

    let totalCount = 0;
    let completedCount = 0;
    let failedCount = 0;
    let failedFiles = [];

    addPhotoBtn.addEventListener("click", () => {
      fileInput.click();
    });

    fileInput.addEventListener("change", async (e) => {
      const files = Array.from(e.target.files);
      if (!files.length) return;

      totalCount += files.length;
      updateProgress();

      for (const file of files) {
        await uploadSingleFile(file);
      }

      fileInput.value = "";
    });

    async function uploadSingleFile(file) {
      const thumb = document.createElement("div");
      thumb.className = "thumb";
      thumb.textContent = "⏳";
      thumbGrid.appendChild(thumb);

      try {
        const filePath = `uploads/${uploadCode}/${Date.now()}_${file.name}`;
        const storageRef = ref(storage, filePath);
        const uploadTask = uploadBytesResumable(storageRef, file);

        await new Promise((resolve, reject) => {
          uploadTask.on(
            "state_changed",
            null,
            (error) => reject(error),
            async () => {
              resolve();
            }
          );
        });

        const downloadURL = await getDownloadURL(uploadTask.snapshot.ref);

        await addDoc(collection(db, "photoUploads"), {
          code: uploadCode,
          fileName: file.name,
          filePath: filePath,
          downloadURL: downloadURL,
          uploadedAt: serverTimestamp()
        });

        completedCount++;
        thumb.textContent = "✅";
        updateProgress();
      } catch (error) {
        console.error("업로드 실패:", error);
        failedCount++;
        failedFiles.push(file);
        thumb.textContent = "❌";
        updateProgress();
        updateFailNotice();
      }
    }

    function updateProgress() {
      progressText.textContent = `전체 진행률: ${completedCount} / ${totalCount}장 완료`;
      const percent = totalCount === 0 ? 0 : (completedCount / totalCount) * 100;
      progressFill.style.width = `${percent}%`;
    }

    function updateFailNotice() {
      if (failedCount > 0) {
        failNotice.textContent = `⚠️ 실패한 사진 ${failedCount}장`;
      } else {
        failNotice.textContent = "";
      }
    }
  });
</script>
</head>
<body>
  <div class="screen">
    <h1>482917 · 사진 올리는 중</h1>

    <button id="addPhotoBtn" class="btn btn-secondary">+ 사진 추가하기</button>
    <input id="fileInput" type="file" accept="image/*" multiple hidden>

    <p id="progressText" class="notice">전체 진행률: 0 / 0장 완료</p>
    <div class="progress-bar">
      <div id="progressFill" class="progress-bar-fill" style="width: 0%;"></div>
    </div>

    <div id="thumbGrid" class="thumb-grid"></div>

    <p id="failNotice" class="notice"></p>

    <button class="btn btn-danger">🔄 실패한 사진 다시 올리기</button>
    <a href="complete.html" class="btn btn-primary">업로드 완료하기</a>
  </div>
</body>
</html>
