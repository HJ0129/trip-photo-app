<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>사진 업로드</title>
  <link rel="stylesheet" href="style.css">

  <style>
    .progress-bar {
      width: 100%;
      height: 16px;
      background: #e5e7eb;
      border-radius: 999px;
      overflow: hidden;
      margin: 12px 0;
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: #2563eb;
      transition: width 0.2s ease;
    }

    .thumb-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin: 16px 0;
    }

    .thumb-item {
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 6px;
      background: #fff;
      text-align: center;
      font-size: 12px;
    }

    .thumb-item img {
      width: 100%;
      height: 90px;
      object-fit: cover;
      border-radius: 6px;
      display: block;
      margin-bottom: 6px;
    }

    .hidden-file-input {
      display: none;
    }
  </style>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getStorage, ref, uploadBytesResumable, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";
    import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
  apiKey: "AIzaSyD6RYhfF9PAToTmoxkQLSxUAXeCQDTY6nA",
  authDomain: "upload-business-photo.firebaseapp.com",
  projectId: "upload-business-photo",
  storageBucket: "upload-business-photo.firebasestorage.app",
  messagingSenderId: "509973531120",
  appId: "1:509973531120:web:fe7f5481e2402a6abb7535"
};

    const app = initializeApp(firebaseConfig);
    const storage = getStorage(app);
    const db = getFirestore(app);

    window.addEventListener("DOMContentLoaded", () => {
      const photoCode = "482917";

      const addPhotoBtn = document.getElementById("addPhotoBtn");
      const fileInput = document.getElementById("fileInput");
      const progressText = document.getElementById("progressText");
      const progressFill = document.getElementById("progressFill");
      const thumbGrid = document.getElementById("thumbGrid");
      const failText = document.getElementById("failText");
      const retryBtn = document.getElementById("retryBtn");

      let totalCount = 0;
      let successCount = 0;
      let failCount = 0;
      let failedFiles = [];

      addPhotoBtn.addEventListener("click", () => {
        fileInput.click();
      });

      retryBtn.addEventListener("click", async () => {
        if (failedFiles.length === 0) {
          alert("다시 올릴 실패 사진이 없습니다.");
          return;
        }

        const retryTargets = [...failedFiles];
        failedFiles = [];
        failCount = 0;
        updateFailUI();

        for (const file of retryTargets) {
          await uploadSingleFile(file);
        }
      });

      fileInput.addEventListener("change", async (event) => {
        const files = Array.from(event.target.files);

        if (files.length === 0) return;

        totalCount += files.length;
        updateProgressUI();

        for (const file of files) {
          await uploadSingleFile(file);
        }

        fileInput.value = "";
      });

      async function uploadSingleFile(file) {
        const fileBox = createThumbBox(file.name);
        thumbGrid.appendChild(fileBox.wrapper);

        try {
          const previewUrl = URL.createObjectURL(file);
          fileBox.image.src = previewUrl;

          const safeFileName = `${Date.now()}_${file.name}`;
          const storageRef = ref(storage, `uploads/${photoCode}/${safeFileName}`);
          const uploadTask = uploadBytesResumable(storageRef, file);

          await new Promise((resolve, reject) => {
            uploadTask.on(
              "state_changed",
              null,
              (error) => reject(error),
              async () => {
                resolve();
              }
            );
          });

          const downloadURL = await getDownloadURL(uploadTask.snapshot.ref);

          await addDoc(collection(db, "photos"), {
            code: photoCode,
            fileName: file.name,
            storagePath: `uploads/${photoCode}/${safeFileName}`,
            downloadURL: downloadURL,
            createdAt: serverTimestamp()
          });

          successCount += 1;
          fileBox.status.textContent = "✅ 업로드 완료";
          fileBox.status.style.color = "green";
          updateProgressUI();
        } catch (error) {
          console.error("업로드 실패:", error);
          failCount += 1;
          failedFiles.push(file);
          fileBox.status.textContent = "❌ 업로드 실패";
          fileBox.status.style.color = "red";
          updateFailUI();
        }
      }

      function updateProgressUI() {
        progressText.textContent = `전체 진행률: ${successCount} / ${totalCount}장 완료`;

        const percent = totalCount === 0 ? 0 : (successCount / totalCount) * 100;
        progressFill.style.width = `${percent}%`;
      }

      function updateFailUI() {
        if (failCount > 0) {
          failText.textContent = `⚠️ 실패한 사진 ${failCount}장`;
          retryBtn.style.display = "inline-block";
        } else {
          failText.textContent = "";
          retryBtn.style.display = "none";
        }
      }

      function createThumbBox(fileName) {
        const wrapper = document.createElement("div");
        wrapper.className = "thumb-item";

        const image = document.createElement("img");
        image.alt = fileName;

        const name = document.createElement("div");
        name.textContent = fileName;

        const status = document.createElement("div");
        status.textContent = "⏳ 업로드 중...";

        wrapper.appendChild(image);
        wrapper.appendChild(name);
        wrapper.appendChild(status);

        return { wrapper, image, status };
      }
    });
  </script>
</head>
<body>
  <div class="screen">
    <h1>482917 · 사진 올리는 중</h1>

    <button id="addPhotoBtn" class="btn btn-secondary">+ 사진 추가하기</button>

    <input
      type="file"
      id="fileInput"
      class="hidden-file-input"
      accept="image/*"
      multiple
    >

    <p id="progressText" class="notice">전체 진행률: 0 / 0장 완료</p>

    <div class="progress-bar">
      <div id="progressFill" class="progress-bar-fill"></div>
    </div>

    <div id="thumbGrid" class="thumb-grid"></div>

    <p id="failText" class="notice"></p>

    <button id="retryBtn" class="btn btn-danger" style="display:none;">🔄 실패한 사진 다시 올리기</button>

    <a href="complete.html" class="btn btn-primary">업로드 완료하기</a>
  </div>
</body>
</html>
