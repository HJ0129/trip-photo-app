<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>사진 업로드</title>
  <link rel="stylesheet" href="style.css">

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getStorage, ref, uploadBytesResumable, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";
    import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyD6RYhfF9PAToTmoxkQLSxUAXeCQDTY6nA",
      authDomain: "upload-business-photo.firebaseapp.com",
      projectId: "upload-business-photo",
      storageBucket: "upload-business-photo.firebasestorage.app",
      messagingSenderId: "509973531120",
      appId: "1:509973531120:web:fe7f5481e2402a6abb7535"
    };

    const app = initializeApp(firebaseConfig);
    const storage = getStorage(app);
    const db = getFirestore(app);

    window.addEventListener("DOMContentLoaded", () => {
      const photoCode = "482917";
      const addPhotoBtn = document.getElementById("addPhotoBtn");
      const fileInput = document.getElementById("fileInput");
      const progressText = document.getElementById("progressText");
      const progressFill = document.getElementById("progressFill");
      const thumbGrid = document.getElementById("thumbGrid");
      const failText = document.getElementById("failText");
      const retryBtn = document.getElementById("retryBtn");

      let totalCount = 0;
      let successCount = 0;
      let failCount = 0;
      let failedFiles = [];

      addPhotoBtn.addEventListener("click", () => {
        fileInput.click();
      });

      fileInput.addEventListener("change", async (event) => {
        const files = Array.from(event.target.files);
        if (!files.length) return;

        totalCount += files.length;
        updateStatus();

        for (const file of files) {
          await uploadSingleFile(file);
        }

        fileInput.value = "";
      });

      retryBtn.addEventListener("click", async () => {
        if (!failedFiles.length) {
          alert("다시 올릴 실패 파일이 없습니다.");
          return;
        }

        const retryTargets = [...failedFiles];
        failedFiles = [];
        failCount = 0;
        updateStatus();

        for (const file of retryTargets) {
          await uploadSingleFile(file);
        }
      });

      async function uploadSingleFile(file) {
        const thumb = document.createElement("div");
        thumb.className = "thumb";
        thumb.textContent = "⏳";
        thumbGrid.appendChild(thumb);

        try {
          const fileName = `${Date.now()}_${file.name}`;
          const storageRef = ref(storage, `uploads/${photoCode}/${fileName}`);
          const uploadTask = uploadBytesResumable(storageRef, file);

          await new Promise((resolve, reject) => {
            uploadTask.on(
              "state_changed",
              null,
              (error) => reject(error),
              async () => {
                resolve();
              }
            );
          });

          const downloadURL = await getDownloadURL(uploadTask.snapshot.ref);

          await addDoc(collection(db, "photos"), {
            code: photoCode,
            fileName: file.name,
            storagePath: `uploads/${photoCode}/${fileName}`,
            downloadURL: downloadURL,
            uploadedAt: serverTimestamp()
          });

          successCount++;
          thumb.textContent = "✅";
          updateStatus();
        } catch (error) {
          console.error("업로드 실패:", error);
          failCount++;
          failedFiles.push(file);
          thumb.textContent = "❌";
          updateStatus();
        }
      }

      function updateStatus() {
        progressText.textContent = `전체 진행률: ${successCount} / ${totalCount}장 완료`;

        const percent = totalCount === 0 ? 0 : (successCount / totalCount) * 100;
        progressFill.style.width = `${percent}%`;

        failText.textContent = failCount > 0 ? `⚠️ 실패한 사진 ${failCount}장` : "";
        retryBtn.style.display = failCount > 0 ? "inline-block" : "none";
      }
    });
  </script>
</head>
<body>
  <div class="screen">
    <h1 id="pageTitle">482917 · 사진 올리는 중</h1>

    <input type="file" id="photoInput" accept="image/*" multiple style="display:none;">

    <button class="btn btn-secondary" id="addPhotoBtn">+ 사진 추가하기</button>

    <p class="notice" id="progressText">전체 진행률: 0 / 50장 완료</p>
    <div class="progress-bar">
      <div class="progress-bar-fill" id="progressBarFill" style="width:0%;"></div>
    </div>

    <div class="thumb-grid" id="thumbGrid"></div>

    <p class="notice" id="failedText" style="display:none;">⚠️ 실패한 사진 0장</p>
    <button class="btn btn-danger" id="retryBtn" style="display:none;">🔄 실패한 사진 다시 올리기</button>

    <a href="complete.html" class="btn btn-primary">업로드 완료하기</a>
  </div>
</body>
  <script type="module">
  import {
    ref,
    uploadBytes,
    getDownloadURL
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";

  import {
    collection,
    addDoc,
    serverTimestamp
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const storage = window.storage;
  const db = window.db;

  const uploadCode = "482917";
  const maxPhotos = 50;

  const addPhotoBtn = document.getElementById("addPhotoBtn");
  const photoInput = document.getElementById("photoInput");
  const progressText = document.getElementById("progressText");
  const progressBarFill = document.getElementById("progressBarFill");
  const thumbGrid = document.getElementById("thumbGrid");
  const failedText = document.getElementById("failedText");
  const retryBtn = document.getElementById("retryBtn");

  let uploadedCount = 0;
  let failedFiles = [];

  addPhotoBtn.addEventListener("click", () => {
    photoInput.click();
  });

  photoInput.addEventListener("change", async (event) => {
    const files = Array.from(event.target.files);

    if (files.length === 0) return;

    const availableSlots = maxPhotos - uploadedCount;
    const selectedFiles = files.slice(0, availableSlots);

    if (files.length > availableSlots) {
      alert(`최대 ${maxPhotos}장까지만 업로드할 수 있습니다.`);
    }

    await uploadFiles(selectedFiles);

    photoInput.value = "";
  });

  retryBtn.addEventListener("click", async () => {
    if (failedFiles.length === 0) return;

    const retryTargets = [...failedFiles];
    failedFiles = [];
    updateFailedUI();

    await uploadFiles(retryTargets);
  });

  async function uploadFiles(files) {
    for (const file of files) {
      const thumb = createThumb("⏳", file.name);

      try {
        const safeFileName = `${Date.now()}_${file.name}`;
        const storageRef = ref(storage, `uploads/${uploadCode}/${safeFileName}`);

        await uploadBytes(storageRef, file);

        const downloadURL = await getDownloadURL(storageRef);

        await addDoc(collection(db, "uploadCodes", uploadCode, "photos"), {
          fileName: file.name,
          storedFileName: safeFileName,
          url: downloadURL,
          status: "success",
          uploadedAt: serverTimestamp()
        });

        uploadedCount++;
        thumb.textContent = "✅";
        updateProgressUI();
      } catch (error) {
        console.error("업로드 실패:", file.name, error);

        failedFiles.push(file);
        thumb.textContent = "❌";
        updateFailedUI();
      }
    }
  }

  function createThumb(status, fileName) {
    const div = document.createElement("div");
    div.className = "thumb";
    div.textContent = status;
    div.title = fileName;
    thumbGrid.appendChild(div);
    return div;
  }

  function updateProgressUI() {
    progressText.textContent = `전체 진행률: ${uploadedCount} / ${maxPhotos}장 완료`;
    const percent = (uploadedCount / maxPhotos) * 100;
    progressBarFill.style.width = `${percent}%`;
  }

  function updateFailedUI() {
    if (failedFiles.length > 0) {
      failedText.style.display = "block";
      retryBtn.style.display = "inline-block";
      failedText.textContent = `⚠️ 실패한 사진 ${failedFiles.length}장`;
    } else {
      failedText.style.display = "none";
      retryBtn.style.display = "none";
    }
  }
</script>
</body>
</html>
